[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-based-gui-controller"
version = "0.1.0"
description = "Vision-based GUI Controller (Google Colab / Google Drive ready)"
requires-python = ">=3.9"
dependencies = ["pillow", "numpy"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["vgc"]
